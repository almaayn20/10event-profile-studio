# gift-profile.bayn-ai.net — استوديو بروفايل الهدايا (نفس التطبيق اللي على :8086)، بـ HTTPS ودومين
server {
    listen 80;
    listen [::]:80;
    server_name gift-profile.bayn-ai.net;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://gift-profile.bayn-ai.net$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gift-profile.bayn-ai.net;
    ssl_certificate /etc/letsencrypt/live/gift-profile.bayn-ai.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gift-profile.bayn-ai.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    root /srv/gift-profile/public;
    index index.php;
    charset utf-8;
    client_max_body_size 160m;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-gift-profile.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
