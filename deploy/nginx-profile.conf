# استوديو البروفايل — http://2.28.103.48:8085 (ثم https://profile.bayn-ai.net بعد ربط الدومين)
server {
    listen 8085;
    listen [::]:8085;
    server_name _;
    root /srv/profile/public;
    index index.php;
    charset utf-8;
    client_max_body_size 160m;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.svg { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    location /build/ { expires 1y; add_header Cache-Control "public, immutable"; }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.4-fpm-profile.sock;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300s;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
