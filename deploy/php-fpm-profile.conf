; استوديو البروفايل — مجمّع PHP-FPM خاص بمستخدم profile
[profile]
user = profile
group = profile
listen = /run/php/php8.4-fpm-profile.sock
listen.owner = www-data
listen.group = www-data
pm = ondemand
pm.max_children = 6
pm.process_idle_timeout = 60s
env[HOME] = /srv/profile-data/home
env[PATH] = /usr/local/bin:/usr/bin:/bin
; ملف البروفايل أكبر من 20 ميجا
php_admin_value[upload_max_filesize] = 150M
php_admin_value[post_max_size] = 160M
php_admin_value[max_execution_time] = 300
php_admin_value[memory_limit] = 512M
